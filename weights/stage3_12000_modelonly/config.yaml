checkpoints:
  checkpoint_interval: 2000
  checkpoints_path: /leonardo_scratch/large/userexternal/mpeppas0/ckpts/stage3
  checkpoints_path_is_shared_file_system: true
  load_lr_scheduler: false
  load_optimizer: false
  resume_checkpoint_path: /leonardo_scratch/large/userexternal/mpeppas0/ckpts/stage2
  save_final_state: true
  save_initial_state: false
data_stages:
- data:
    dataset:
      dataset_folder:
      - /leonardo_scratch/large/userexternal/mpeppas0/STAGE_3_RUN/STAGE_3_COSMO/part_0
      - /leonardo_scratch/large/userexternal/mpeppas0/STAGE_3_RUN/STAGE_3_FINEWEB/part_0
      - /leonardo_scratch/large/userexternal/mpeppas0/STAGE_3_RUN/STAGE_3_FINEWEB/part_1
      - /leonardo_scratch/large/userexternal/mpeppas0/STAGE_3_RUN/STAGE_3_STARCODER/part_0
      - /leonardo_scratch/large/userexternal/mpeppas0/STAGE_3_RUN/STAGE_3_SLIMPYJAMA/part_0
      - /leonardo_scratch/large/userexternal/mpeppas0/STAGE_3_RUN/STAGE_3_OPENMATH/part_0
      - /leonardo_scratch/large/userexternal/mpeppas0/STAGE_3_RUN/STAGE_3_STACKEX/part_0
      - /leonardo_scratch/large/userexternal/mpeppas0/STAGE_3_RUN/STAGE_3_STACKEX/part_1
      dataset_max_tokens: null
      dataset_read_path: null
      dataset_weights:
      - 0.03125
      - 0.17187
      - 0.17187
      - 0.15625
      - 0.01562
      - 0.17187
      - 0.14063
      - 0.14064
      pad_samples_to_global_batch_size: false
      return_positions: true
      shuffle_files: false
      skip_in_stream: false
      token_size_in_bytes: 4
      tokenizer_name: meta-llama/Meta-Llama-3-8B
      use_old_brrr_dataloader: false
      vocab_size: 128256
    num_loading_workers: 8
    seed: 42
  name: Stage 3
  sequence_length: 1024
  start_training_step: 1
general:
  benchmark_csv_path: null
  consumed_train_samples: 3072000
  ignore_sanity_checks: true
  project: pretrain_stage3
  run: run_32layers_4B
  seed: 42
  step: 12000
lighteval: null
logging:
  iteration_step_info_interval: 10
  log_level: info
  log_level_replica: info
metrics_logging: null
model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16
  init_method:
    scaling_method: NUM_LAYERS
    std: 0.02
  make_vocab_size_divisible_by: 128
  model_config:
    _attn_implementation: flash_attention_2
    attention_bias: false
    bos_token_id: 1
    eos_token_id: 2
    hidden_act: silu
    hidden_size: 1024
    initializer_range: 0.02
    intermediate_size: 2816
    is_llama_config: true
    max_position_embeddings: 2048
    num_attention_heads: 16
    num_hidden_layers: 32
    num_key_value_heads: 4
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-05
    rope_interleaved: false
    rope_scaling: null
    rope_theta: 10000.0
    tie_word_embeddings: true
    use_cache: true
    vocab_size: 128256
    z_loss_coefficient: 0.0001
    z_loss_enabled: false
optimizer:
  accumulate_grad_in_fp32: true
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 5.0e-05
    lr_decay_starting_step: null
    lr_decay_steps: 14260
    lr_decay_style: cosine
    lr_warmup_steps: 1000
    lr_warmup_style: linear
    min_decay_lr: 5.0e-06
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.1
  weight_decay_exclude_named_params: []
  zero_stage: 0
parallelism:
  context_parallel_size: 1
  dp: 4
  expert_parallel_size: 1
  pp: 1
  pp_engine: afab
  recompute_layer: true
  tp: 1
  tp_linear_async_communication: false
  tp_mode: ALL_REDUCE
  tp_recompute_allgather: true
profiler: null
s3_upload: null
tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: meta-llama/Meta-Llama-3-8B
  tokenizer_revision: null
tokens:
  batch_accumulation_per_replica: 16
  limit_test_batches: 0
  limit_val_batches: 0
  micro_batch_size: 4
  sequence_length: 1024
  train_steps: 15260
  val_check_interval: -1
